<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orthys — Minecraft сервер</title>
    <meta name="description" content="Orthys — уютный Minecraft сервер для вас.">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background: #0b0d12;
            color: #ffffff;

            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 30px;
            text-align: center;
        }

        .logo {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 6px;
            margin-bottom: 15px;
        }

        .subtitle {
            color: #9da3b0;
            font-size: 18px;
            margin-bottom: 45px;
        }

        .server {
            background: #12151c;
            border: 1px solid #202530;
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 15px;
        }

        .server-title {
            color: #8f98aa;
            font-size: 13px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .ip {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        button,
        .discord {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 13px 18px;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;
            text-decoration: none;
            display: block;

            transition: 0.2s;
        }

        button {
            background: #ffffff;
            color: #0b0d12;
        }

        button:hover {
            background: #e5e7eb;
        }

        .discord {
            background: #5865f2;
            color: white;
            margin-top: 10px;
        }

        .discord:hover {
            background: #4752c4;
        }

        .info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .info-card {
            background: #12151c;
            border: 1px solid #202530;
            border-radius: 14px;
            padding: 18px;
        }

        .info-title {
            color: #777f90;
            font-size: 12px;
            margin-bottom: 7px;
            text-transform: uppercase;
        }

        .info-value {
            font-size: 16px;
            font-weight: 600;
        }

        .about {
            margin-top: 35px;
            color: #8f96a5;
            font-size: 14px;
            line-height: 1.6;
        }

        footer {
            margin-top: 35px;
            color: #555c6b;
            font-size: 12px;
        }

        @media (max-width: 500px) {
            .container {
                padding: 20px;
            }

            .logo {
                font-size: 38px;
            }

            .info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">ORTHYS</div>

    <div class="subtitle">
        Уютный сервер для вас
    </div>

    <div class="server">

        <div class="server-title">
            Minecraft сервер
        </div>

        <div class="ip" id="ip">
            play.orthys.ru
        </div>

        <button onclick="copyIP()">
            Скопировать IP
        </button>

        <a
            class="discord"
            href="https://discord.gg/CHANGE_ME"
            target="_blank"
        >
            Discord
        </a>

    </div>

    <div class="info">

        <div class="info-card">
            <div class="info-title">
                Версия
            </div>

            <div class="info-value">
                26.1.2
            </div>
        </div>

        <div class="info-card">
            <div class="info-title">
                Режим
            </div>

            <div class="info-value">
                Выживание
            </div>
        </div>

    </div>

    <div class="about">
        Orthys — уютное ванильное выживание,
        где можно просто играть, строить и
        проводить время вместе с друзьями.
    </div>

    <footer>
        © 2026 Orthys
    </footer>

</div>

<script>
    function copyIP() {
        const ip = document.getElementById("ip").innerText;

        navigator.clipboard.writeText(ip).then(() => {
            alert("IP сервера скопирован!");
        });
    }
</script>

</body>
</html>
